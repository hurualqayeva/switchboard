[project]
name = "switchboard"
version = "0.1.0"
description = "Multi-tenant LLM inference and routing platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Huru Algayeva", email = "hurualqayeva@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "structlog>=24.4",
    "asyncpg>=0.32.0",
    "pyyaml>=6.0.3",
    "aioboto3>=15.5.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
switchboard = "switchboard.main:run"
switchboard-admin = "switchboard.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "pre-commit>=3.8",
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0.12.20261030",
    "asyncpg-stubs>=0.32.0",
    "types-aiobotocore[bedrock-runtime]>=3.10.0",
    "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switchboard"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint.isort]
known-first-party = ["switchboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "ASYNC", "S", "RUF", "PT", "SIM", "TCH"]
ignore = ["S101"]  # assert is fine in tests and for invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
packages = ["switchboard"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["aioboto3", "aioboto3.*", "botocore.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs docker compose services",
]

[tool.coverage.run]
source = ["switchboard"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
