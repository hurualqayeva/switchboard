global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: switchboard
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: llama
    static_configs:
      - targets: ["llama:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
